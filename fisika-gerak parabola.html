<script>
const $=s=>document.querySelector(s),f=x=>(+x).toFixed(2).replace('.',','),ab='ABCDE';
const T=[['home','Beranda'],['s1','1 Karakteristik'],['s2','2 Komponen'],['s3','3 Waktu &amp; Jangkauan'],['s4','4 Sudut'],['s5','5 Penerapan'],['sim','Simulasi'],['ev','Evaluasi'],['rf','Refleksi'],['lp','Laporan']];
let S={name:'',kelas:'',absen:'',tgl:'',sc:{},ev:null,rf:null},cur='home',E=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('gp')||'{}'))}catch(e){}
const save=()=>{const t=$('#st');try{localStorage.setItem('gp',JSON.stringify(S));if(t)t.textContent='Tersimpan otomatis ✓'}catch(e){if(t)t.textContent='Penyimpanan browser tidak tersedia'}};
const Q=(q,o,a,e)=>({q,o,a,e});
const QS={
s1:[Q('Bola ditendang dan bergerak melengkung; hambatan udara diabaikan. Mengapa lintasannya parabola?',['Gerak horizontal GLB dipadukan dengan gerak vertikal GLBB','Bola terus dipercepat ke depan','Gravitasi bekerja pada arah horizontal','Kecepatan berubah arah tanpa penyebab','Massa bola berubah saat melayang'],0,'Arah x: tanpa percepatan (GLB). Arah y: percepatan g ke bawah (GLBB). Perpaduannya berbentuk parabola.'),
Q('Di titik tertinggi lintasan, pernyataan yang benar adalah ...',['kecepatan dan percepatan bola nol','komponen vertikal nol, komponen horizontal tetap','komponen horizontal nol, komponen vertikal maksimum','percepatan nol karena bola berhenti sesaat','kecepatan sama dengan kecepatan awal'],1,'Di puncak vy = 0, tetapi vx tidak berubah dan percepatan tetap g.'),
Q('Bola A dijatuhkan dan bola B ditendang mendatar dari ketinggian sama. Mana yang tiba di tanah lebih dulu?',['A lebih dulu','B lebih dulu','Bersamaan, karena gerak vertikal keduanya identik','Bergantung massa','Tidak dapat ditentukan'],2,'Gerak vertikal keduanya GLBB dari keadaan vy awal = 0, sehingga waktunya sama.')],
s2:[Q('Bola ditendang 25 m/s pada sudut 37° (sin 37° = 0,6; cos 37° = 0,8). Komponen horizontal dan vertikal awalnya ...',['15 m/s dan 20 m/s','20 m/s dan 15 m/s','25 m/s dan 0','12 m/s dan 16 m/s','20 m/s dan 20 m/s'],1,'vx = 25 × 0,8 = 20 m/s; vy = 25 × 0,6 = 15 m/s.'),
Q('Dengan kecepatan awal tetap, sudut elevasi diperbesar dari 30° ke 60°. Yang terjadi ...',['vx naik, vy turun','vx dan vy naik','vx turun, vy naik','vx dan vy turun','keduanya tetap'],2,'cos θ mengecil sedangkan sin θ membesar pada rentang 30° sampai 60°.'),
Q('Bola dilempar 10 m/s pada sudut 53° (sin 53° = 0,8; cos 53° = 0,6). Perbandingan vy : vx ...',['3 : 4','4 : 3','5 : 4','1 : 1','5 : 3'],1,'vy = 8 m/s, vx = 6 m/s, sehingga 8 : 6 = 4 : 3.')],
s3:[Q('Bola ditendang 20 m/s pada sudut 30°, g = 10 m/s². Tinggi maksimumnya ...',['5 m','10 m','15 m','20 m','1 m'],0,'vy = 10 m/s; h = 10² / (2 × 10) = 5 m.'),
Q('Pada soal yang sama, waktu total di udara ...',['1 s','1,5 s','2 s','3 s','4 s'],2,'t total = 2 × 10 / 10 = 2 s.'),
Q('Pada soal yang sama, jangkauan horizontalnya ...',['10 m','10√3 m','20 m','20√3 m','40 m'],3,'R = 20² × sin 60° / 10 = 40 × ½√3 = 20√3 m (± 34,6 m).')],
s4:[Q('Jika ketinggian awal sama dengan ketinggian akhir dan v0 tetap, jangkauan maksimum diperoleh pada sudut ...',['15°','30°','45°','60°','90°'],2,'R sebanding dengan sin 2θ, maksimum saat 2θ = 90°, yaitu θ = 45°.'),
Q('Peluncur bola diuji pada v0 sama: sudut 30° dan 60° menghasilkan jangkauan hampir sama. Perbedaan lintasannya ...',['60° lebih rendah dan lebih singkat','60° lebih tinggi dan waktu di udara lebih lama','keduanya sama tinggi','30° lebih tinggi dan lebih lama','waktu di udara keduanya sama'],1,'sin 60° > sin 30°, sehingga vy lebih besar: lebih tinggi dan lebih lama. Jangkauan sama karena sin 60° = sin 120°.'),
Q('Tabel uji (v0 sama): sudut 15° → R = 20 m; sudut 75° → R = 20 m. Kesimpulan yang tepat ...',['Sudut komplementer menghasilkan jangkauan sama','Sudut kecil selalu lebih jauh','Sudut besar selalu lebih jauh','Jangkauan tidak bergantung sudut','Lintasan 15° lebih tinggi dari 75°'],0,'15° + 75° = 90° (komplementer), sin 30° = sin 150°.')],
s5:[Q('Pemain basket melempar bola 10 m/s pada sudut 53° (sin 53° = 0,8), g = 10 m/s². Waktu mencapai titik tertinggi ...',['0,6 s','0,8 s','1,0 s','1,6 s','8 s'],1,'vy = 8 m/s; t naik = 8 / 10 = 0,8 s.'),
Q('Data tendangan (g = 10): A = 20 m/s, 30°; B = 20 m/s, 60°. Pernyataan yang benar ...',['A lebih lama di udara','B lebih lama di udara dan lebih tinggi','tinggi keduanya sama','A lebih tinggi','jangkauan B jauh lebih besar'],1,'B: t = 3,46 s, h = 15 m. A: t = 2 s, h = 5 m. Jangkauan keduanya sama (± 34,6 m).'),
Q('Bola ditendang dengan vx tetap 12 m/s dan melayang selama 3 s. Jarak mendatarnya ...',['4 m','15 m','24 m','36 m','48 m'],3,'x = vx × t = 12 × 3 = 36 m.')]};
const EV=[Q('Bola ditendang 40 m/s pada sudut 37° (sin = 0,6). Komponen vertikal awalnya ...',['16 m/s','24 m/s','32 m/s','30 m/s','40 m/s'],1,'vy = 40 × 0,6 = 24 m/s.'),
Q('Bola 20 m/s, sudut 37° (sin = 0,6), g = 10 m/s². Tinggi maksimum ...',['7,2 m','12 m','14,4 m','28,8 m','3,6 m'],0,'vy = 12; h = 144/20 = 7,2 m.'),
Q('Pada kondisi yang sama, waktu total di udara ...',['1,2 s','2,4 s','3,2 s','1,6 s','4,8 s'],1,'t = 2 × 12 / 10 = 2,4 s.'),
Q('Bola 10 m/s dilempar 45°, g = 10 m/s². Jangkauannya ...',['5 m','7,5 m','10 m','20 m','100 m'],2,'R = 10² × sin 90° / 10 = 10 m.'),
Q('Bola ditendang dengan v0 dan sudut sama di Bumi (g = 10) dan Bulan (g = 1,6). Jangkauan di Bulan ...',['sama','sekitar 6 kali lebih jauh','sekitar 6 kali lebih dekat','1,6 kali lebih jauh','10 kali lebih jauh'],1,'R ∝ 1/g, sehingga 10 / 1,6 ≈ 6,25 kali lebih jauh.'),
Q('Dua lemparan dengan v0 sama pada sudut 20° dan 70°. Pernyataan yang benar ...',['jangkauan 70° lebih jauh','jangkauan 20° lebih jauh','jangkauan sama, lintasan 70° lebih tinggi','jangkauan sama, tinggi sama','jangkauan sama, lintasan 20° lebih tinggi'],2,'20° + 70° = 90° (komplementer): R sama, sudut lebih besar lebih tinggi.'),
Q('Selama bola melayang (tanpa hambatan udara), percepatannya di titik tertinggi ...',['nol','g ke bawah','g ke atas','g mendatar','v0 sin θ'],1,'Percepatan selalu g ke bawah, termasuk di puncak.'),
Q('Kecepatan horizontal bola tetap selama melayang karena ...',['tidak ada gaya mendatar (hambatan udara diabaikan)','gaya dorong terus bekerja','gravitasi searah gerak','massa bola tetap','energi kinetik bola konstan'],0,'Tanpa gaya mendatar, ax = 0 sehingga vx konstan.')];
const ST={s1:'Karakteristik Gerak Parabola',s2:'Komponen Kecepatan Awal',s3:'Waktu, Tinggi Maksimum, dan Jangkauan',s4:'Pengaruh Sudut Elevasi',s5:'Penerapan Gerak Parabola'};
const quiz=k=>{const d=S.sc[k];return '<h3>Latihan &amp; Kuis Formatif</h3>'+QS[k].map((q,i)=>`<div class=card><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<label class=op><input type=radio name="${k}${i}" value=${j} ${d?'disabled':''} ${(d?d.a[i]:(S.dr||{})[k+i])==j?'checked':''} onchange="dr('${k}${i}',${j})"> ${ab[j]}. ${o}</label>`).join('')}<div id="${k}f${i}"></div></div>`).join('')+`<button class=p ${d?'disabled':''} onclick="sub('${k}')">Kirim Jawaban</button> <b id="${k}r"></b>`};
function dr(a,b){S.dr=S.dr||{};S.dr[a]=b;save()}
function sv(){if(E&&!S.ev)S.es={it:E.it.map(x=>({i:EV.indexOf(x.q),p:x.p})),ans:E.ans,i:E.i,rev:E.rev};save()}
function idn(){S.name=$('#nm').value.trim();S.kelas=$('#kl').value.trim();S.absen=$('#ab').value.trim();if(S.name&&!S.tgl)S.tgl=new Date().toLocaleDateString('id-ID');save()}
function rd(){S.rd={lvl:$('#lv').value,exp:$('#ex').value,r:[...document.querySelectorAll('.rt')].map(x=>x.value)};save()}
function sub(k){const a=QS[k].map((q,i)=>{const r=document.querySelector(`input[name="${k}${i}"]:checked`);return r?+r.value:null});if(a.includes(null))return alert('Jawab semua soal terlebih dahulu.');S.sc[k]={a,n:a.filter((x,i)=>x==QS[k][i].a).length};save();fb(k);document.querySelectorAll(`input[name^="${k}"]`).forEach(x=>x.disabled=1);updPg()}
function fb(k){const d=S.sc[k];if(!d)return;QS[k].forEach((q,i)=>{$(`#${k}f${i}`).innerHTML=d.a[i]==q.a?`<span class=ok>✓ Benar.</span> ${q.e}`:`<span class=no>✗ Belum tepat. Jawaban: ${ab[q.a]}.</span> ${q.e}`});$(`#${k}r`).textContent=`Skor: ${d.n}/${QS[k].length} (${Math.round(d.n/QS[k].length*100)}%)`}
const P={},I={};
const ex=(s,j)=>`<div class=card><h3>Contoh Soal</h3>${s}<details><summary><b>Lihat pembahasan</b> (coba kerjakan dahulu di buku)</summary>${j}</details></div>`;
const EX={
s1:ex('Sebuah bola ditendang pemain sepak bola sehingga bergerak membentuk lintasan melengkung. Hambatan udara diabaikan. Analisislah:<br>a. Mengapa lintasan bola berbentuk parabola?<br>b. Jenis gerak pada arah horizontal?<br>c. Jenis gerak pada arah vertikal?<br>d. Pengaruh gravitasi terhadap gerak bola?','<p><b>a.</b> Bola melakukan dua gerak sekaligus: gerak lurus beraturan pada sumbu x dan gerak lurus berubah beraturan pada sumbu y. Perpaduan keduanya menghasilkan lintasan parabola.</p><p><b>b.</b> GLB. Tidak ada gaya mendatar, sehingga vx konstan.</p><p><b>c.</b> GLBB dengan percepatan g ke bawah: diperlambat saat naik, dipercepat saat turun.</p><p><b>d.</b> Gravitasi memberi percepatan tetap g ke bawah. Gravitasi mengurangi vy saat naik (vy = 0 di puncak) dan menambahnya saat turun, tetapi tidak mengubah vx.</p>'),
s2:ex('Seorang pemain menendang bola dengan kecepatan awal 25 m/s pada sudut elevasi 37° (sin 37° = 0,6; cos 37° = 0,8). Tentukan:<br>a. Komponen kecepatan horizontal<br>b. Komponen kecepatan vertikal','<p>Diketahui: v0 = 25 m/s, θ = 37°.</p><p><b>a.</b> vx = v0 cos θ = 25 × 0,8 = <b>20 m/s</b></p><p><b>b.</b> vy = v0 sin θ = 25 × 0,6 = <b>15 m/s</b></p><p>Pengecekan: √(20² + 15²) = √625 = 25 m/s, sesuai v0.</p>'),
s3:ex('Sebuah bola ditendang dengan kecepatan awal 20 m/s pada sudut elevasi 30°. Jika g = 10 m/s², tentukan:<br>a. Waktu mencapai titik tertinggi<br>b. Tinggi maksimum<br>c. Waktu total di udara<br>d. Jangkauan horizontal','<p>Diketahui: v0 = 20 m/s, θ = 30°, g = 10 m/s². Maka vy = 20 × 0,5 = 10 m/s dan vx = 20 × ½√3 = 10√3 m/s.</p><p><b>a.</b> t naik = vy / g = 10 / 10 = <b>1 s</b></p><p><b>b.</b> h maks = vy² / 2g = 10² / (2 × 10) = <b>5 m</b></p><p><b>c.</b> t total = 2 × t naik = <b>2 s</b></p><p><b>d.</b> R = vx × t total = 10√3 × 2 = <b>20√3 m</b> (± 34,6 m). Dengan rumus: R = v0² sin 2θ / g = 400 × ½√3 / 10 = 20√3 m.</p>'),
s4:ex('Seorang petugas olahraga menguji peluncur bola dengan kecepatan awal yang sama pada beberapa sudut. Hasilnya, sudut 30° dan 60° menghasilkan jangkauan hampir sama. Jelaskan mengapa hal itu terjadi dan bandingkan tinggi maksimum kedua lintasan.','<p><b>Jangkauan:</b> R = v0² sin 2θ / g. Untuk 30°, sin 60° = ½√3. Untuk 60°, sin 120° = ½√3. Nilainya sama, sehingga jangkauan sama. Sudut 30° dan 60° komplementer (jumlahnya 90°).</p><p><b>Tinggi maksimum:</b> h = (v0 sin θ)² / 2g, sebanding dengan sin² θ. sin² 30° = ¼ dan sin² 60° = ¾, jadi lintasan 60° tiga kali lebih tinggi. Misal v0 = 20 m/s, g = 10: h(30°) = 5 m dan h(60°) = 15 m.</p><p><b>Waktu di udara:</b> sebanding dengan sin θ, sehingga lintasan 60° lebih lama (3,46 s dibanding 2 s).</p>'),
s5:ex('Seorang pemain basket melempar bola dengan kecepatan awal 10 m/s pada sudut 53° (sin 53° = 0,8; cos 53° = 0,6), g = 10 m/s². Hitung waktu mencapai titik tertinggi, tinggi maksimum dari titik lemparan, dan jarak mendatar saat bola kembali setinggi titik lemparan.','<p>vx = 10 × 0,6 = 6 m/s; vy = 10 × 0,8 = 8 m/s.</p><p>t naik = 8 / 10 = <b>0,8 s</b></p><p>h maks = 8² / (2 × 10) = <b>3,2 m</b></p><p>t total = 2 × 0,8 = 1,6 s, sehingga jarak mendatar = vx × t total = 6 × 1,6 = <b>9,6 m</b>.</p><p>Catatan: pada keadaan nyata, ketinggian tangan dan ring berbeda, sehingga waktu dan jarak sedikit berbeda dari model ideal.</p>')};
const mc=(s,o,a,j)=>ex(s+'<div style="margin-top:6px">'+o.map((x,i)=>ab[i]+'. '+x).join('<br>')+'</div>','<p><b>Jawaban: '+ab[a]+'. '+o[a]+'</b></p>'+j);
Object.assign(EX,{
s1:mc('Bola tenis dipukul dan melayang membentuk lintasan melengkung. Hambatan udara diabaikan. Pernyataan yang benar tentang gerak bola adalah ...',['Arah horizontal GLBB, arah vertikal GLB','Arah horizontal dan vertikal sama-sama GLB','Arah horizontal GLB, arah vertikal GLBB dengan percepatan g ke bawah','Arah horizontal dipercepat oleh gaya pukulan, arah vertikal GLB','Arah horizontal dan vertikal sama-sama GLBB'],2,'<p><b>Langkah:</b> (1) Tanpa hambatan udara, tidak ada gaya mendatar sehingga ax = 0 dan vx konstan (GLB). (2) Pada arah vertikal bekerja gravitasi, percepatannya g ke bawah (GLBB): bola melambat saat naik, vy = 0 di puncak, lalu bertambah cepat saat turun. (3) Perpaduan GLB dan GLBB menghasilkan lintasan parabola.</p><p><b>Pengecoh:</b> pukulan hanya bekerja saat bola bersentuhan dengan raket; setelah lepas, hanya gravitasi yang bekerja.</p>'),
s2:mc('Pemain voli melempar bola dengan kecepatan awal 30 m/s pada sudut elevasi 53° (sin 53° = 0,8; cos 53° = 0,6). Komponen kecepatan horizontal dan vertikal awal bola berturut-turut ...',['24 m/s dan 18 m/s','30 m/s dan 0','15 m/s dan 20 m/s','18 m/s dan 18 m/s','18 m/s dan 24 m/s'],4,'<p><b>Diketahui:</b> v0 = 30 m/s, θ = 53°. <b>Ditanya:</b> vx dan vy.</p><p>vx = v0 cos θ = 30 × 0,6 = <b>18 m/s</b></p><p>vy = v0 sin θ = 30 × 0,8 = <b>24 m/s</b></p><p>Pengecekan: √(18² + 24²) = √900 = 30 m/s. <b>Pengecoh:</b> pilihan A menukar sin dan cos, yang paling sering terjadi.</p>'),
s3:mc('Bola ditendang dengan kecepatan awal 20 m/s pada sudut 53° (sin 53° = 0,8; cos 53° = 0,6), g = 10 m/s². Jangkauan horizontal bola ...',['12,8 m','38,4 m','25,6 m','19,2 m','76,8 m'],1,'<p><b>Diketahui:</b> v0 = 20 m/s, θ = 53°, g = 10 m/s². Maka vx = 20 × 0,6 = 12 m/s dan vy = 20 × 0,8 = 16 m/s.</p><p>t naik = vy / g = 16 / 10 = 1,6 s</p><p>h maks = vy² / 2g = 256 / 20 = 12,8 m</p><p>t total = 2 × 1,6 = 3,2 s</p><p>R = vx × t total = 12 × 3,2 = <b>38,4 m</b>. Dengan rumus: R = v0² sin 2θ / g = 400 × (2 × 0,8 × 0,6) / 10 = 38,4 m.</p><p><b>Pengecoh:</b> 12,8 m adalah tinggi maksimum; 19,2 m memakai t naik, bukan t total.</p>'),
s4:mc('Tabel hasil uji lemparan dengan kecepatan awal 10 m/s dan g = 10 m/s²:<table><tr><th>Sudut</th><th>20°</th><th>45°</th><th>70°</th></tr><tr><td>Jangkauan</td><td>6,4 m</td><td>10 m</td><td>6,4 m</td></tr></table>Kesimpulan yang tepat berdasarkan tabel adalah ...',['Semakin besar sudut, jangkauan selalu semakin jauh','Jangkauan tidak bergantung pada sudut','Sudut 45° menghasilkan jangkauan paling kecil','Sudut komplementer (20° dan 70°) menghasilkan jangkauan sama, dan 45° menghasilkan jangkauan terbesar','Sudut 70° lebih jauh daripada 20° karena lintasannya lebih tinggi'],3,'<p><b>Langkah:</b> (1) Baca tabel: 20° dan 70° sama-sama 6,4 m. (2) 20° + 70° = 90°, jadi keduanya komplementer dan sin 40° = sin 140°. (3) Nilai terbesar, 10 m, ada pada 45° (sin 90° = 1). Karena itu pilihan D benar.</p><p>Lintasan 70° memang lebih tinggi dan lebih lama di udara, tetapi jangkauannya tetap sama dengan 20°, sehingga pilihan E salah.</p>'),
s5:mc('Data uji dua lemparan bola (g = 10 m/s²):<table><tr><th>Lemparan</th><th>v0</th><th>Sudut</th></tr><tr><td>P</td><td>10 m/s</td><td>53°</td></tr><tr><td>Q</td><td>10 m/s</td><td>37°</td></tr></table>(sin 53° = cos 37° = 0,8; cos 53° = sin 37° = 0,6). Pernyataan yang benar ...',['Lemparan P lebih tinggi dan lebih lama di udara, jangkauan keduanya sama','Lemparan Q lebih tinggi dan lebih lama di udara, jangkauan keduanya sama','Lemparan P lebih jauh karena sudutnya lebih besar','Kedua lemparan memiliki tinggi dan waktu di udara yang sama','Lemparan Q lebih jauh dan lebih lama di udara'],0,'<p><b>P:</b> vy = 8 m/s → t total = 1,6 s; h = 64/20 = 3,2 m; vx = 6 m/s → R = 6 × 1,6 = 9,6 m.</p><p><b>Q:</b> vy = 6 m/s → t total = 1,2 s; h = 36/20 = 1,8 m; vx = 8 m/s → R = 8 × 1,2 = 9,6 m.</p><p><b>Kesimpulan:</b> jangkauan sama (9,6 m) karena 53° dan 37° komplementer. P lebih tinggi (3,2 m dibanding 1,8 m) dan lebih lama di udara (1,6 s dibanding 1,2 s).</p>')});
P.home=()=>`<div class=card><svg viewBox="0 0 300 120" width=100%><path id=pp d="M10 110 Q150 -50 290 110" fill=none stroke="#f28c28" stroke-dasharray=4 stroke-width=2 /><circle r=8 fill="#f28c28"><animateMotion dur=2.5s repeatCount=indefinite><mpath href="#pp"/></animateMotion></circle></svg><h2>Gerak Parabola</h2><i>Jelajahi Lintasannya, Pahami Fisikanya!</i><p>Fisika · Fase E / Kelas X · SMA Negeri 2 Linggo Sari Baganti · TA 2026/2027</p><h3>Tujuan Pembelajaran</h3><ul><li>Menjelaskan perpaduan GLB (horizontal) dan GLBB (vertikal)</li><li>Menguraikan kecepatan awal menjadi komponen vx dan vy</li><li>Menghitung waktu naik, tinggi maksimum, waktu total, dan jangkauan</li><li>Menganalisis pengaruh sudut elevasi dan kecepatan awal</li><li>Menghubungkan konsep dengan kehidupan sehari-hari</li></ul><h3>Identitas</h3><input id=nm oninput="idn()" placeholder="Nama lengkap" value="${S.name}"> <input id=kl oninput="idn()" placeholder="Kelas" size=8 value="${S.kelas}"> <input id=ab oninput="idn()" placeholder="No. absen (opsional)" size=18 value="${S.absen}"><br><button class=p onclick="start()">MULAI BELAJAR</button>${S.pg&&S.pg!='home'?`<button onclick="location.hash='${S.pg}'">Lanjutkan Belajar</button>`:''}<button onclick="rst()">Reset Data</button><p><small>Progress, jawaban, evaluasi yang sedang dikerjakan, dan refleksi tersimpan otomatis di browser HP ini setiap kali murid menjawab. Buka kembali tautan yang sama dengan browser yang sama untuk melanjutkan (tombol Lanjutkan Belajar). Jangan memakai mode privat/penyamaran dan jangan menghapus data situs atau riwayat browser. Data tidak otomatis tersinkron ke perangkat lain atau terkirim ke guru.</small></p></div><div class=g>${T.slice(1,6).map(t=>`<div class=card><b>${t[1]}</b><br><small>${S.sc[t[0]]?'Kuis selesai: '+S.sc[t[0]].n+'/3':'Belum dikerjakan'}</small><br><button onclick="location.hash='${t[0]}'">Buka</button></div>`).join('')}</div>`;
function start(){const n=$('#nm').value.trim();if(!n)return alert('Isi nama lengkap terlebih dahulu.');S.name=n;S.kelas=$('#kl').value.trim();S.absen=$('#ab').value.trim();S.tgl=new Date().toLocaleDateString('id-ID');save();location.hash='s1'}
function rst(){if(confirm('Hapus semua progress, jawaban, dan refleksi di perangkat ini?')){S={name:'',kelas:'',absen:'',tgl:'',sc:{},ev:null,rf:null};E=null;save();render()}}
P.s1=()=>`<div class=card><h2>1. ${ST.s1}</h2><p>Gerak parabola adalah gerak benda yang dilempar dengan sudut tertentu terhadap horizontal dan hanya dipengaruhi gravitasi (hambatan udara diabaikan). Lintasannya berbentuk parabola.</p><ul><li><b>Sumbu x:</b> tanpa percepatan, GLB, vx konstan.</li><li><b>Sumbu y:</b> percepatan g ke bawah, GLBB, vy berubah.</li><li>Kedua gerak bebas satu sama lain; waktu menjadi penghubungnya.</li></ul><div class=fm>x = v0 cos θ · t<br>y = v0 sin θ · t − ½ g t²</div><p>Contoh: tendangan sepak bola, lemparan bola basket, lompat jauh. Coba lihat lintasannya di tab <b>Simulasi</b>.</p></div>${EX.s1}${quiz('s1')}`;
P.s2=()=>`<div class=card><h2>2. ${ST.s2}</h2><p>Kecepatan awal v0 dengan sudut elevasi θ diuraikan menjadi:</p><div class=fm>vx = v0 cos θ<br>vy = v0 sin θ</div><label>v0: <input type=range id=v2 min=5 max=40 value=25> <b id=v2o></b> m/s</label><br><label>θ: <input type=range id=a2 min=0 max=90 value=37> <b id=a2o></b>°</label><svg viewBox="0 0 300 200" width=100%><path d="M20 180H290M20 180V10" stroke="#888" fill=none /><line id=lh x1=20 y1=180 stroke="#2f6fd0" stroke-width=3 /><line id=lv x1=20 y1=180 stroke="#2a9d5c" stroke-width=3 stroke-dasharray=5 /><line id=lr x1=20 y1=180 stroke="#f28c28" stroke-width=3 /></svg><div id=o2></div><table><tr><th>θ</th><th>0°</th><th>30°</th><th>37°</th><th>45°</th><th>53°</th><th>60°</th><th>90°</th></tr><tr><td>sin</td><td>0</td><td>0,5</td><td>0,6</td><td>0,71</td><td>0,8</td><td>0,87</td><td>1</td></tr><tr><td>cos</td><td>1</td><td>0,87</td><td>0,8</td><td>0,71</td><td>0,6</td><td>0,5</td><td>0</td></tr></table><p><b>Contoh:</b> v0 = 25 m/s, θ = 37° → vx = 25 × 0,8 = 20 m/s; vy = 25 × 0,6 = 15 m/s.</p></div>${EX.s2}${quiz('s2')}`;
I.s2=()=>{const u=()=>{const v=+$('#v2').value,a=+$('#a2').value*Math.PI/180,x=v*Math.cos(a),y=v*Math.sin(a),k=4;$('#v2o').textContent=v;$('#a2o').textContent=$('#a2').value;$('#lh').setAttribute('x2',20+x*k);$('#lh').setAttribute('y2',180);$('#lv').setAttribute('x1',20+x*k);$('#lv').setAttribute('y1',180);$('#lv').setAttribute('x2',20+x*k);$('#lv').setAttribute('y2',180-y*k);$('#lr').setAttribute('x2',20+x*k);$('#lr').setAttribute('y2',180-y*k);$('#o2').innerHTML=`<b>vx = ${f(x)} m/s</b> (biru) · <b>vy = ${f(y)} m/s</b> (hijau) · v0 = ${v} m/s (oranye)`};$('#v2').oninput=$('#a2').oninput=u;u()};
P.s3=()=>`<div class=card><h2>3. ${ST.s3}</h2><div class=fm>t naik = v0 sin θ / g<br>h maks = (v0 sin θ)² / 2g<br>t total = 2 v0 sin θ / g<br>R = v0² sin 2θ / g</div><b>Kalkulator</b><br><label>v0 <input type=number id=v3 value=20 style="width:70px"></label> <label>θ <input type=number id=a3 value=30 style="width:70px"></label> <label>g <input type=number id=g3 value=10 style="width:70px"></label><div id=o3></div><p><b>Contoh:</b> v0 = 20 m/s, θ = 30°, g = 10 m/s². vy = 10 m/s → t naik = 1 s; h maks = 5 m; t total = 2 s; R = 20√3 ≈ 34,6 m.</p></div>${EX.s3}${quiz('s3')}`;
I.s3=()=>{const u=()=>{const v=+$('#v3').value,a=+$('#a3').value*Math.PI/180,g=+$('#g3').value||10,vy=v*Math.sin(a);$('#o3').innerHTML=`t naik = <b>${f(vy/g)} s</b> · h maks = <b>${f(vy*vy/2/g)} m</b> · t total = <b>${f(2*vy/g)} s</b> · R = <b>${f(v*v*Math.sin(2*a)/g)} m</b>`};['v3','a3','g3'].forEach(i=>$('#'+i).oninput=u);u()};
const COL={15:'#2f6fd0',30:'#2a9d5c',45:'#f28c28',60:'#c0392b',75:'#8e44ad'};
P.s4=()=>`<div class=card><h2>4. ${ST.s4}</h2><p>Pada v0 tetap (20 m/s, g = 10 m/s²), pilih sudut untuk dibandingkan:</p>${Object.keys(COL).map(a=>`<label style="margin-right:10px"><input type=checkbox class=ck value=${a} ${a==30||a==60?'checked':''}> <span style="color:${COL[a]}">■</span> ${a}°</label>`).join('')}<canvas id=c4 width=600 height=280></canvas><div id=o4></div><ul><li>Jangkauan maksimum pada 45°.</li><li>Sudut komplementer (misal 30° dan 60°) menghasilkan jangkauan sama.</li><li>Dari pasangan komplementer, sudut lebih besar: lebih tinggi dan lebih lama di udara.</li></ul></div>${EX.s4}${quiz('s4')}`;
function draw(cv,L){const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.clearRect(0,0,W,H);const P2=L.map(o=>{const r=o.a*Math.PI/180,vx=o.v*Math.cos(r),vy=o.v*Math.sin(r);return{...o,vx,vy,tt:2*vy/o.g,h:vy*vy/2/o.g,R:2*vx*vy/o.g}}),mR=Math.max(...P2.map(p=>p.R),1),mh=Math.max(...P2.map(p=>p.h),1),m=30,s=Math.min((W-2*m)/mR,(H-2*m)/mh);c.strokeStyle='#889';c.lineWidth=1;c.beginPath();c.moveTo(m,H-m);c.lineTo(W-10,H-m);c.stroke();P2.forEach(p=>{c.strokeStyle=p.color;c.lineWidth=2.5;c.beginPath();for(let i=0;i<=100;i++){const t=p.tt*i/100,x=m+p.vx*t*s,y=H-m-(p.vy*t-.5*p.g*t*t)*s;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()});return{P:P2,m,s,H,c}}
I.s4=()=>{const u=()=>{const L=[...document.querySelectorAll('.ck:checked')].map(x=>({v:20,a:+x.value,g:10,color:COL[x.value]})),d=draw($('#c4'),L);$('#o4').innerHTML='<table><tr><th>θ</th><th>h maks (m)</th><th>R (m)</th><th>t total (s)</th></tr>'+d.P.map(p=>`<tr><td>${p.a}°</td><td>${f(p.h)}</td><td>${f(p.R)}</td><td>${f(p.tt)}</td></tr>`).join('')+'</table>'};document.querySelectorAll('.ck').forEach(x=>x.onchange=u);u()};
P.s5=()=>`<div class=card><h2>5. ${ST.s5}</h2><p>Gerak parabola muncul pada tendangan sepak bola, lemparan bola basket dan bola voli, lompat jauh, serta semburan air dari selang. Pada kenyataannya hambatan udara dan ketinggian awal yang berbeda membuat lintasan sedikit menyimpang dari model ideal.</p><p><b>Studi kasus (g = 10 m/s²):</b></p><table><tr><th>Tendangan</th><th>v0</th><th>Sudut</th></tr><tr><td>A</td><td>20 m/s</td><td>30°</td></tr><tr><td>B</td><td>20 m/s</td><td>60°</td></tr></table><p>Identifikasi data, hitung vy, h maks, dan t total masing-masing, bandingkan, lalu simpulkan: jangkauan sama, tetapi B lebih tinggi dan lebih lama di udara.</p></div>${EX.s5}${quiz('s5')}`;
for(const k in QS)I[k]=I[k]||(()=>fb(k));['s2','s3','s4'].forEach(k=>{const o=I[k];I[k]=()=>{o();fb(k)}});
let simT=0,run=false,last=0;
P.sim=()=>`<div class=card><h2>Simulasi Gerak Parabola</h2><label>Kecepatan awal <input type=range id=v min=5 max=40 value=20> <b id=vo></b> m/s</label><br><label>Sudut elevasi <input type=range id=a min=5 max=85 value=45> <b id=ao></b>°</label><br><label>Gravitasi <input type=range id=g min=1.6 max=25 step=.1 value=10> <b id=go></b> m/s²</label><br><button class=p onclick="simGo()">▶ Mulai</button><button onclick="run=false">⏸ Jeda</button><button onclick="simT=0;run=false;simDraw()">↺ Ulangi</button><canvas id=cv width=600 height=300></canvas><div id=ro></div><p><small>Panah oranye: kecepatan sesaat. Hambatan udara diabaikan; titik awal dan akhir sama tinggi.</small></p></div>`;
function simDraw(){const v=+$('#v').value,a=+$('#a').value,g=+$('#g').value;$('#vo').textContent=v;$('#ao').textContent=a;$('#go').textContent=g;const d=draw($('#cv'),[{v,a,g,color:'#f28c28'}]),p=d.P[0],t=Math.min(simT,p.tt),x=d.m+p.vx*t*d.s,y=d.H-d.m-(p.vy*t-.5*g*t*t)*d.s,vy=p.vy-g*t,c=d.c;c.fillStyle='#0b2a5b';c.beginPath();c.arc(x,y,8,0,7);c.fill();c.strokeStyle='#2f6fd0';c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+p.vx*3,y-vy*3);c.stroke();$('#ro').innerHTML=`<table><tr><td>vx = ${f(p.vx)} m/s</td><td>vy awal = ${f(p.vy)} m/s</td><td>t naik = ${f(p.vy/g)} s</td><td>h maks = ${f(p.h)} m</td></tr><tr><td>t total = ${f(p.tt)} s</td><td>R = ${f(p.R)} m</td><td>t = ${f(t)} s</td><td>vy sesaat = ${f(vy)} m/s</td></tr></table>`;if(simT>=p.tt)run=false}
function simGo(){const tt=2*$('#v').value*Math.sin($('#a').value*Math.PI/180)/$('#g').value;if(simT>=tt)simT=0;run=true;last=performance.now();requestAnimationFrame(lp)}
function lp(ts){if(!run)return;simT+=(ts-last)/1000;last=ts;simDraw();if(run)requestAnimationFrame(lp)}
I.sim=()=>{simT=0;run=false;['v','a','g'].forEach(i=>$('#'+i).oninput=()=>{simT=0;run=false;simDraw()});simDraw()};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cat=s=>s>=80?'Tercapai':s>=60?'Cukup Tercapai':'Belum Tercapai (Remediasi)';
P.ev=()=>S.ev?evRes():!E?`<div class=card><h2>Evaluasi Akhir</h2><p>${EV.length} soal pilihan ganda A–E, satu soal per halaman. Urutan soal dan pilihan diacak. Anda dapat meninjau jawaban sebelum mengirim; setelah dikumpulkan, jawaban dikunci. KKTP = 80.</p><button class=p onclick="E={it:sh(EV.map(q=>({q,p:sh([0,1,2,3,4])}))),ans:[],i:0,rev:0};render()">Mulai Evaluasi</button></div>`:E.rev?evRev():evQ();
function evQ(){const x=E.it[E.i],n=E.it.length,last=E.i==n-1;return `<div class=card><small>Soal ${E.i+1} dari ${n} · terjawab ${E.ans.filter(a=>a!=null).length}</small><div class=bar><i style="width:${(E.i+1)/n*100}%"></i></div><p><b>${x.q.q}</b></p>${x.p.map((pi,j)=>`<label class=op><input type=radio name=eo ${E.ans[E.i]===j?'checked':''} onchange="E.ans[E.i]=${j};sv()"> ${ab[j]}. ${x.q.o[pi]}</label>`).join('')}<button onclick="E.i=Math.max(0,E.i-1);render()">← Sebelumnya</button><button class=p onclick="${last?'E.rev=1':'E.i++'};render()">${last?'Tinjau Jawaban':'Berikutnya →'}</button></div>`}
function evRev(){return `<div class=card><h2>Tinjau Jawaban</h2><div class=g>${E.it.map((x,i)=>`<button onclick="E.rev=0;E.i=${i};render()">Soal ${i+1}: ${E.ans[i]!=null?ab[E.ans[i]]:'<span class=no>kosong</span>'}</button>`).join('')}</div><button class=p onclick="evSub()">Kirim &amp; Kunci Jawaban</button></div>`}
function evSub(){const u=E.it.filter((x,i)=>E.ans[i]==null).length;if(!confirm((u?u+' soal belum dijawab. ':'')+'Kirim jawaban? Setelah dikirim jawaban dikunci.'))return;const b=E.it.filter((x,i)=>E.ans[i]!=null&&x.p[E.ans[i]]==x.q.a).length;S.es=null;S.ev={score:Math.round(b/E.it.length*100),benar:b,n:E.it.length,tgl:new Date().toLocaleDateString('id-ID')};save();render();updPg()}
function evRes(){const r=S.ev;return `<div class=card><h2>Hasil Evaluasi Akhir</h2><h1>${r.score}</h1><p>Benar ${r.benar} dari ${r.n} · Kategori: <b>${cat(r.score)}</b></p>${E?E.it.map((x,i)=>{const ok=E.ans[i]!=null&&x.p[E.ans[i]]==x.q.a;return `<div class=card><b>${i+1}. ${x.q.q}</b><br>${ok?'<span class=ok>✓ Benar</span>':'<span class=no>✗ Belum tepat</span>'} · Jawaban benar: ${ab[x.p.indexOf(x.q.a)]}. ${x.q.o[x.q.a]}<br>${x.q.e}</div>`}).join(''):'<small>Pembahasan hanya ditampilkan pada sesi pengerjaan. Reset data di Beranda untuk mengulang.</small>'}</div>`}
