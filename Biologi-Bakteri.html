<style>
:root{--g:#2f5d46;--sb:#2f5d46;--bt:#fff;--s:#dfe9df;--b:#e3f2fb;--bg:#f6faf6;--t:#1d2a22;--c:#fff;--ln:#c5d5c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;font:16px/1.65 "Nunito",system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}
#app{min-height:100vh}aside{background:var(--sb);color:#fff;padding:8px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.25)}
aside h1{font-size:16px;margin:0}#nv{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}aside button.n{background:none;border:0;color:#fff;padding:6px 11px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;white-space:nowrap}aside button.n:hover{background:rgba(255,255,255,.15)}aside button.on{background:rgba(255,255,255,.28)}
.pb{height:8px;background:rgba(255,255,255,.25);border-radius:5px;margin:8px 0}.pb div{height:100%;background:#a9dcf2;border-radius:5px}
main{margin:0 auto;padding:20px;max-width:960px}h1,h2,h3{font-family:"Poppins","Nunito",sans-serif}h2{color:var(--g)}
.box{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;padding:7px;border:1px solid var(--ln);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid var(--ln);padding:3px}th{background:var(--s)}td input{border:0;padding:4px}
.b{background:var(--g);color:var(--bt);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;margin:3px 2px}
.ch{height:240px}.opt{display:block;padding:7px;border:1px solid var(--ln);border-radius:8px;margin:4px 0;cursor:pointer;background:var(--c)}
.ok{background:#cfead6!important;color:#143}.no{background:#f7d4d4!important;color:#411}
#lens{width:200px;height:200px;border-radius:50%;border:6px solid var(--g);overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--b)}
#cell{border-radius:50%;background:#5fa57a;flex:none}.cl{cursor:pointer}.cl:hover{opacity:.7}
.nums button{width:34px;height:34px;margin:2px;border-radius:8px;border:1px solid var(--ln);background:var(--c);color:var(--t);cursor:pointer}.nums .on{background:var(--g);color:var(--bt)}
.hero{background:linear-gradient(135deg,var(--s),var(--b));border-radius:16px;padding:20px}
@media(max-width:800px){main{padding:12px}aside{padding:6px 8px}aside button.n{padding:5px 8px;font-size:12px}aside h1{font-size:14px}}
@media print{aside,.np{display:none}}

const NM=["Beranda","Apersepsi","Materi 1 – Mengenal Bakteri","Materi 2 – Struktur Sel Bakteri","Materi 3 – Bentuk dan Klasifikasi","Materi 4 – Reproduksi dan Pertumbuhan","Materi 5 – Faktor Pertumbuhan","Materi 6 – Peranan Bakteri","Laboratorium Digital","Evaluasi","Refleksi","Laporan Hasil Belajar"];
const SN=["Beranda","Apersepsi","Materi 1","Materi 2","Materi 3","Materi 4","Materi 5","Materi 6","Laboratorium","Evaluasi","Refleksi","Laporan"];
const M=[
{t:"Mengenal Bakteri",x:"Bakteri adalah organisme uniseluler prokariotik: tidak memiliki membran inti, DNA berada di nukleoid. Ukurannya sekitar 0,5–5 µm, sehingga hanya terlihat dengan mikroskop (mata telanjang hanya mampu melihat sekitar 100 µm). Bakteri pertama kali diamati Antonie van Leeuwenhoek (1676); Louis Pasteur dan Robert Koch mengembangkan mikrobiologi. Sel eukariotik (hewan, tumbuhan) memiliki membran inti dan organel bermembran, ukurannya lebih besar. Bakteri hidup di tanah sawah, air sumur, makanan, pesisir, tubuh makhluk hidup, bahkan lingkungan ekstrem.",c:["Nama objek","Jenis organisme","Perkiraan ukuran","Membran inti?","Kesimpulan"],a:["Mengapa bakteri disebut organisme prokariotik?","Mengapa bakteri tidak dapat diamati dengan mata telanjang?","Mengapa bakteri ditemukan di berbagai habitat?"],q:["Air sumur warga tampak jernih, tetapi pemeriksaan laboratorium menemukan sel bakteri. Mengapa bakteri tidak terlihat?|Ukurannya hanya sekitar 0,5–5 µm|Jumlahnya selalu sangat sedikit|Bakteri tidak berwarna sehingga transparan|Bakteri hanya hidup di tubuh manusia|Bakteri bukan makhluk hidup|Ukuran bakteri jauh di bawah batas penglihatan mata telanjang sehingga perlu mikroskop.","Sel bakteri di tanah sawah berbeda dari sel tumbuhan karena bakteri ...|tidak memiliki membran inti|tidak memiliki DNA|tidak memiliki dinding sel|tidak memiliki ribosom|tidak memiliki sitoplasma|Bakteri prokariotik: DNA di nukleoid tanpa membran inti, tetapi tetap punya DNA, dinding sel, ribosom, dan sitoplasma."]},
{t:"Struktur Sel Bakteri",x:"Kapsul: lapisan lendir pelindung dan perekat. Dinding sel (peptidoglikan): menjaga bentuk dan melindungi sel. Membran plasma: mengatur keluar masuk zat. Sitoplasma: tempat reaksi metabolisme. Ribosom: sintesis protein. Nukleoid: DNA utama pembawa informasi genetik. Plasmid: DNA melingkar kecil pembawa sifat tambahan (misalnya resistensi antibiotik). Pili/fimbria: perlekatan; pili khusus berperan dalam transfer DNA (konjugasi). Flagel: alat gerak. Endospora: struktur tahan kondisi ekstrem pada bakteri tertentu (misalnya Bacillus, Clostridium), bukan alat reproduksi.",c:["Nama struktur","Fungsi","Akibat jika tidak berfungsi"],a:["Apa perbedaan fungsi dinding sel dan membran plasma?","Bagaimana plasmid membantu bakteri memperoleh sifat baru?"],q:["Bakteri di air laut bergerak aktif menuju sumber nutrien. Struktur yang berperan adalah ...|flagel|kapsul|plasmid|ribosom|nukleoid|Flagel adalah alat gerak bakteri.","Sel bakteri di tanah tetap utuh bentuknya meski tekanan air berubah. Struktur yang menjaga bentuk dan melindungi sel adalah ...|dinding sel|ribosom|plasmid|pili|sitoplasma|Dinding sel (peptidoglikan) mempertahankan bentuk dan memberi perlindungan."]},
{t:"Bentuk dan Klasifikasi Bakteri",x:"Bentuk: kokus (bulat), basil (batang), spirilum (spiral kaku), spiroket (spiral lentur), vibrio (koma). Susunan: diplo- (berpasangan), strepto- (rantai), stafilo- (bergerombol seperti anggur). Pewarnaan Gram: Gram positif (peptidoglikan tebal) dan Gram negatif (peptidoglikan tipis dengan membran luar). Kebutuhan oksigen: aerob obligat, anaerob obligat, anaerob fakultatif, mikroaerofil. Nutrisi: autotrof (fotosintesis/kemosintesis) dan heterotrof. Jenis bakteri tidak dapat dipastikan hanya dari tampilan makanan; perlu pengamatan mikroskopis atau identifikasi laboratorium.",c:["No. gambar","Ciri bentuk","Susunan","Kelompok bakteri","Alasan"],a:["Apa perbedaan kokus dan basil?","Apa perbedaan Gram positif dan Gram negatif?"],q:["Pengamatan mikroskop sampel menunjukkan sel bulat yang berderet membentuk rantai. Susunannya disebut ...|streptokokus|diplobasil|stafilokokus|spirilum|vibrio|Kokus berantai = streptokokus.","Sebuah bakteri tidak dapat tumbuh bila ada oksigen. Kelompok bakteri ini ...|anaerob obligat|aerob obligat|mikroaerofil|anaerob fakultatif|autotrof|Anaerob obligat tidak membutuhkan dan terhambat oleh oksigen."]},
{t:"Reproduksi dan Pertumbuhan Bakteri",x:"Bakteri berkembang biak dengan pembelahan biner: replikasi DNA, sel memanjang, terbentuk sekat, lalu dua sel anak. Pada model ideal, N = N₀ × 2ⁿ (N akhir, N₀ awal, n = lama waktu ÷ waktu generasi). Konjugasi, transformasi, dan transduksi adalah perpindahan materi genetik, bukan reproduksi yang langsung menambah jumlah sel. Di alam, pertumbuhan dibatasi nutrisi, ruang, dan penumpukan limbah.",c:["Waktu (menit)","Generasi","Jumlah bakteri"],a:["Bagaimana jumlah bakteri berubah setelah beberapa pembelahan?","Mengapa pertumbuhan di alam tidak eksponensial tanpa batas?"],q:["Ikan di pasar mengandung 100 sel bakteri (model ideal), waktu generasi 30 menit. Jumlah setelah 2 jam adalah ...|1.600|400|800|3.200|200|n = 120÷30 = 4, N = 100 × 2⁴ = 1.600.","Konjugasi, transformasi, dan transduksi berbeda dari pembelahan biner karena ...|memindahkan materi genetik tanpa langsung menambah jumlah sel|menghasilkan dua sel anak|hanya terjadi pada eukariot|menghasilkan endospora|membelah sitoplasma|Ketiganya adalah mekanisme perpindahan materi genetik."]},
{t:"Faktor yang Memengaruhi Pertumbuhan Bakteri",x:"Faktor: suhu, pH, nutrisi, ketersediaan air, oksigen, salinitas, waktu, dan zat penghambat. Kelompok berdasarkan suhu: psikrofil (optimum suhu rendah), psikrotrof (tumbuh pada suhu dingin tetapi optimum lebih tinggi), mesofil (optimum sekitar 20–45 °C), termofil (sekitar 45–80 °C), hipertermofil (di atas 80 °C). Setiap bakteri memiliki kondisi optimum berbeda. Pendinginan memperlambat, belum tentu membunuh, bakteri. CATATAN: data di simulasi adalah model pembelajaran, bukan hasil pemeriksaan sampel nyata.",c:["No.","Faktor yang diuji","Kondisi perlakuan","Hasil pertumbuhan simulasi","Interpretasi"],a:["Mengapa ikan nelayan yang disimpan dingin lebih lambat membusuk?","Apakah semua bakteri tumbuh optimal pada suhu yang sama? Jelaskan dengan datamu."],q:["Ikan hasil tangkapan nelayan disimpan dalam es (±4 °C) dan lebih awet. Penyebabnya ...|suhu rendah memperlambat aktivitas dan pertumbuhan bakteri pembusuk|semua bakteri langsung mati|es menambah nutrisi bakteri|oksigen habis seluruhnya|pH naik drastis|Pendinginan memperlambat pertumbuhan; bakteri psikrotrof masih dapat tumbuh pelan.","Nasi yang dibiarkan di suhu ruang tropis (±30 °C) cepat basi karena ...|suhu mendekati optimum bakteri mesofil|suhu terlalu tinggi bagi bakteri|suhu terlalu rendah bagi bakteri|tidak ada nutrisi|tidak ada air|Suhu ruang mendekati kisaran optimum mesofil, ditambah nutrisi dan air yang cukup."]},
{t:"Peranan Bakteri dalam Kehidupan",x:"Menguntungkan: Lactobacillus bulgaricus (yoghurt), Lactococcus lactis (produk susu), Rhizobium (fiksasi nitrogen di bintil akar legum), Nitrosomonas dan Nitrobacter (nitrifikasi), bakteri pengurai bahan organik, dan bakteri dalam bioteknologi. Merugikan: Salmonella enterica (salmonellosis), Vibrio cholerae (kolera), Mycobacterium tuberculosis (tuberkulosis), E. coli patogen tertentu, Clostridium tetani (tetanus). Tidak semua bakteri berbahaya; banyak strain E. coli hidup normal di usus manusia, hanya strain tertentu yang patogen.",c:["Nama bakteri","Peranan","Menguntungkan/merugikan","Bidang kehidupan","Contoh penerapan/dampak"],a:["Mengapa tidak semua bakteri merugikan manusia?","Bagaimana mencegah penyakit akibat bakteri pada makanan di pasar dan sekolah?"],q:["Petani menanam kacang tanah untuk menyuburkan sawah dan ladang. Bakteri yang berperan adalah ...|Rhizobium|Salmonella enterica|Vibrio cholerae|Clostridium tetani|Mycobacterium tuberculosis|Rhizobium memfiksasi nitrogen di bintil akar legum.","Seorang murid menyatakan semua E. coli menyebabkan diare. Pernyataan yang tepat ...|banyak strain E. coli hidup normal di usus, hanya strain tertentu yang patogen|semua E. coli patogen|E. coli tidak pernah menyebabkan penyakit|E. coli adalah virus|E. coli hanya hidup di laut|Peran E. coli bergantung pada strain."]}];
const E=["Tabel: sel X berukuran ±2 µm, tanpa membran inti, DNA melingkar di nukleoid. Sel X adalah ...|sel prokariotik|sel hewan|sel tumbuhan|sel eukariotik|sel jamur|Ciri tersebut menunjukkan prokariotik.","Bakteri patogen di sebuah pasar menjadi kebal antibiotik setelah menerima DNA kecil melingkar dari bakteri lain. DNA tersebut disebut ...|plasmid|ribosom|flagel|kapsul|dinding sel|Plasmid membawa sifat tambahan seperti resistensi antibiotik.","Sampel air payau pesisir memperlihatkan sel berbentuk koma. Bentuk itu disebut ...|vibrio|kokus|basil|spiroket|stafilokokus|Bentuk koma = vibrio (bentuk saja belum menentukan spesies).","Sebuah bakteri membelah tiap 20 menit (model ideal). Setelah 100 menit jumlahnya ...|32 sel|16 sel|64 sel|10 sel|100 sel|n = 5, N = 1 × 2⁵ = 32.","Data model simulasi: 5 °C = 10, 25 °C = 70, 37 °C = 100, 60 °C = 5. Kesimpulan paling tepat ...|pertumbuhan optimum di sekitar 37 °C dan menurun pada suhu ekstrem|makin tinggi suhu makin cepat tumbuh|suhu tidak berpengaruh|60 °C adalah suhu optimum|5 °C membunuh semua bakteri|Data menunjukkan puncak pada 37 °C dan penurunan di suhu ekstrem.","Ikan dalam es bersih awet lebih lama, sedangkan ikan dalam ember di suhu ruang cepat berbau. Tindakan pencegahan paling tepat ...|menjaga suhu dingin, kebersihan alat dan air, serta memasak matang|mencuci dengan air tercemar limbah|membiarkan ikan terbuka di tempat hangat|menambah air sumur yang tidak diolah|menyimpan tanpa wadah|Penanganan higienis dan suhu dingin menekan pertumbuhan bakteri pembusuk."];

function quiz(k,qs,pre){return T(qs.map((s,n)=>{const a=s.split("|"),id="q"+k+"_"+n;Q[id]={o:a.slice(1,6).sort(()=>Math.random()-.5),a:a[1],e:a[6]};return `<div class=box><b>${n+1}.</b> ${a[0]}${T(Q[id].o.map((o,j)=>`<label class=opt id=${id}_${j} onclick="pick('${id}',${j})">${"ABCDE"[j]}. ${o}</label>`))}<div id=f${id}></div></div>`}))}

function mic(){const i=+$("#ob").value,o=O[i],m=+$("#mg").value,px=o[2]*m/30,l=$("#lens");$("#mgv").textContent=m;l.innerHTML=SV[i];l.firstChild.style.cssText=`flex:none;width:${Math.max(3,Math.min(px,900))}px`;$("#mi").innerHTML=`<b>${o[0]}</b>: ±${o[2]} µm. ${o[1]}. ${LB[i]} ${px<8?"Terlalu kecil pada perbesaran ini.":"Terlihat."} ${o[2]<10?"Perlu mikroskop.":"Lebih besar; ukuran sel eukariot."}`}
