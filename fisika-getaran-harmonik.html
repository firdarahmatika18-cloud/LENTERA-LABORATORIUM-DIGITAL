<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media Interaktif Fisika: Getaran Harmonik</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:#1E1B4B;background:#F5F3FF;font-family:Centaur,"Centaur MT","Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}html{font-size:17px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#7C3AED;z-index:40}
.card{background:#fff;color:#1E1B4B;border-radius:1rem;box-shadow:0 4px 14px rgba(124,58,237,.10);padding:1rem;margin-bottom:.8rem}
.btn{background:#7C3AED;color:#fff;border-radius:.75rem;padding:.7rem 1rem;font-weight:600;min-height:44px}
.btn2{background:#DDD6FE;color:#5B21B6;border-radius:.75rem;padding:.6rem .9rem;font-weight:600;min-height:44px}
.opt{display:flex;gap:.5rem;align-items:flex-start;padding:.6rem;border:1px solid #DDD6FE;border-radius:.75rem;margin:.3rem 0;min-height:44px}
textarea,input[type=text]{background:#fff;color:#1E1B4B;border:1px solid #C4B5FD;border-radius:.6rem;padding:.5rem;width:100%}
canvas{width:100%;display:block;background:#FAF8FF;border-radius:.75rem;border:1px solid #DDD6FE}
table{border-collapse:collapse;width:100%;font-size:.75rem;color:#1E1B4B}button{color:inherit}td,th{border:1px solid #C4B5FD;padding:.3rem;text-align:center}th{background:#EDE9FE}
input[type=range]{width:100%;accent-color:#7C3AED}
.tabbtn.on{color:#7C3AED;font-weight:700;background:#EDE9FE}
@media print{header,nav,.noprint,.bg{display:none!important}body{background:#fff}body::before{display:none}@page{size:A4;margin:15mm}#app{max-width:none!important;padding:0!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
</style></head>
<body>
<svg class="bg fixed inset-0 w-full h-full pointer-events-none" viewBox="0 0 800 600" preserveAspectRatio="none" fill="none" stroke="#8B5CF6" stroke-opacity=".14" stroke-width="3">
<path d="M0 120Q50 60 100 120T200 120T300 120T400 120T500 120T600 120T700 120T800 120"/>
<path d="M0 470Q50 410 100 470T200 470T300 470T400 470T500 470T600 470T700 470T800 470"/>
<path d="M650 0L700 130" /><circle cx="700" cy="140" r="14" fill="#C4B5FD" fill-opacity=".3"/>
<path d="M60 250l14 10-28 10 28 10-28 10 28 10-14 10" /></svg>

<header class="sticky z-30 text-white shadow" style="top:env(safe-area-inset-top,0px);background:#7C3AED">
<div class="max-w-2xl mx-auto px-3 py-2">
<div class="flex items-center justify-between gap-2"><div class="font-bold text-sm leading-tight">Media Interaktif Fisika: Getaran Harmonik</div>
<button class="text-xs bg-white/20 rounded-lg px-2 py-2" onclick="askReset()">🗑️ Reset</button></div>
<div class="flex items-center gap-2 mt-1 text-xs"><div class="flex-1 h-2 bg-white/30 rounded-full overflow-hidden"><div id="pbar" class="h-2 bg-white rounded-full" style="width:0"></div></div><span id="ptxt">0%</span><span id="sv" class="opacity-90">💾 LocalStorage aktif</span></div>
</div></header>

<main id="app" class="relative max-w-2xl mx-auto p-3 pb-28"></main>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-violet-200 grid grid-cols-6" style="padding-bottom:env(safe-area-inset-bottom,0px)">
<button class="tabbtn py-2 text-[11px]" data-t="home" onclick="go('home')">🏠<br>Beranda</button>
<button class="tabbtn py-2 text-[11px]" data-t="diag" onclick="go('diag')">📋<br>Asesmen</button>
<button class="tabbtn py-2 text-[11px]" data-t="mod" onclick="go('mod')">📚<br>Modul</button>
<button class="tabbtn py-2 text-[11px]" data-t="hots" onclick="go('hots')">✍️<br>HOTS</button>
<button class="tabbtn py-2 text-[11px]" data-t="eval" onclick="go('eval')">📝<br>Evaluasi</button>
<button class="tabbtn py-2 text-[11px]" data-t="rep" onclick="go('rep')">📊<br>Laporan</button>
</nav>
<div id="modal" class="noprint hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4"><div id="mbox" class="card w-full max-w-sm"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='ghs_fisika_v3';
const fresh=()=>({ans:{},kk:{},t1:[],t2:[],t4:[],tgl:'',diag:null,mods:{},hots:{},rows:[],an:['','','',''],kes:'',ev:null,nama:'',kelas:''});
let S=fresh(),tab='home',modN=0;
function loadProgress(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}}
function saveProgress(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#sv').textContent='✅ Tersimpan'}catch(e){$('#sv').textContent='⚠️ Gagal simpan'}prog()}
function clearAllProgress(){try{localStorage.removeItem(KEY)}catch(e){}S=fresh();closeM();go('home')}
function addSimulationDataToTable(){
 if(labTab!=='b'){return toast('Catat data pada tab Bandul.')}
 if(sw.el<=0||sw.run){return toast('Hentikan stopwatch setelah 10 getaran dulu.')}
 const g=sw.g||G[gi],l=sw.l||lp,mm=sw.m||mp,T=sw.el/10;
 S.rows.push({l:l,m:mm,g:g,t:sw.el,T:T,T2:T*T,gh:4*Math.PI*Math.PI*l/(T*T)});saveProgress();tbl();swReset();
}
function deleteTableRow(i){S.rows.splice(i,1);saveProgress();tbl()}
function clearTableData(){S.rows=[];saveProgress();tbl()}
function toast(m){modal(`<p>${m}</p><button class="btn w-full mt-3" onclick="closeM()">OK</button>`)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeM(){$('#modal').classList.add('hidden')}
function askReset(){modal(`<b>Reset total progress?</b><p class="text-sm mt-2">Semua jawaban, data tabel, kesimpulan, dan nilai akan dihapus dan tidak bisa dikembalikan.</p><div class="flex gap-2 mt-3"><button class="btn2 flex-1" onclick="closeM()">Batal</button><button class="btn flex-1" onclick="clearAllProgress()">Ya, hapus</button></div>`)}

/* ===== DATA SOAL ===== */
const DIAG_OLD=[
{q:'Sebuah pegas k = 200 N/m ditarik sejauh 0,05 m. Gaya pegas (Hukum Hooke) adalah ...',o:['4 N','10 N','40 N','100 N'],a:1,e:'F = k·x = 200 × 0,05 = 10 N.'},
{q:'Benda bergetar 20 kali dalam 5 sekon. Frekuensinya ...',o:['0,25 Hz','4 Hz','25 Hz','100 Hz'],a:1,e:'f = n/t = 20/5 = 4 Hz.'},
{q:'Nilai sin 30° adalah ...',o:['0,5','0,87','1','0'],a:0,e:'sin 30° = 1/2 = 0,5.'},
{q:'Kecepatan sudut benda dengan frekuensi 2 Hz adalah ...',o:['π rad/s','2π rad/s','4π rad/s','8π rad/s'],a:2,e:'ω = 2πf = 2π(2) = 4π rad/s.'},
{q:'Dua pegas identik (konstanta k) disusun seri. Konstanta pegas penggantinya ...',o:['2k','k','k/2','k/4'],a:2,e:'1/ks = 1/k + 1/k = 2/k, sehingga ks = k/2.'}];
const HOTS_OLD=[
{q:'Grafik simpangan-waktu bandul jam dinding tua menunjukkan 5 puncak dalam 10 s, sedangkan dawai gitar nada tinggi menunjukkan 440 puncak dalam 1 s. Kesimpulan yang tepat (C4) adalah ...',o:['Dawai gitar bergetar lebih lambat karena amplitudonya kecil','Bandul: T = 2 s, f = 0,5 Hz; dawai: T ≈ 2,3 ms; frekuensi dawai jauh lebih besar','Keduanya memiliki periode sama','Bandul memiliki frekuensi lebih tinggi'],a:1,e:'Bandul: f = 5/10 = 0,5 Hz, T = 2 s. Dawai: f = 440 Hz, T = 1/440 ≈ 0,0023 s.'},
{q:'Piston mesin bergerak y = 0,04 sin(100t) m. Analisis (C4): percepatan maksimum piston dan posisinya ...',o:['4 m/s² di y = 0','400 m/s² di simpangan maksimum (y = ±A)','400 m/s² di titik setimbang','4000 m/s² di y = 0'],a:1,e:'a_maks = Aω² = 0,04 × 100² = 400 m/s², terjadi di y = ±A (saat v = 0).'},
{q:'Seorang astronot membawa jam bandul dan jam pegas ke Bulan (g ≈ 1/6 g Bumi). Evaluasi (C5): jam yang tetap akurat adalah ...',o:['Jam bandul, karena T bandul tidak bergantung g','Jam pegas, karena T = 2π√(m/k) tidak bergantung g; jam bandul menjadi lambat sekitar √6 kali','Keduanya tetap akurat','Keduanya melambat'],a:1,e:'Bandul: T ∝ 1/√g sehingga T membesar √6 ≈ 2,45 kali. Pegas: T tidak memuat g.'},
{q:'Pada trampolin (abaikan gesekan), analisis (C4/C5): saat pelompat berada di titik terendah sesaat berhenti ...',o:['Ek maksimum, Ep pegas nol','Ek nol, Ep pegas maksimum; energi mekanik total tetap','Ek dan Ep sama-sama nol','Energi mekanik bertambah'],a:1,e:'Di simpangan maksimum v = 0 sehingga Ek = 0 dan Ep = ½kA² maksimum. Em konstan jika tidak ada gesekan.'},
{q:'Gedung tinggi berfrekuensi alami 0,5 Hz berada di zona gempa dengan frekuensi dominan sekitar 0,5 Hz. Rancangan mitigasi terbaik (C6) ...',o:['Membuat gedung lebih ringan tanpa mengubah frekuensi','Memasang Tuned Mass Damper yang disetel pada 0,5 Hz agar bergetar berlawanan fase dan meredam getaran','Menambah tinggi gedung agar frekuensi sama','Tidak ada yang perlu dilakukan'],a:1,e:'Resonansi menyebabkan amplitudo besar. TMD yang disetel pada frekuensi alami gedung menyerap energi dan mengurangi amplitudo.'}];
const EV_OLD=[
{q:'Bandul sederhana panjang 1 m, g = π² m/s². Periodenya ...',o:['1 s','2 s','4 s','π s'],a:1,e:'T = 2π√(l/g) = 2π√(1/π²) = 2 s.'},
{q:'Beban 0,5 kg pada pegas k = 50 N/m. Periode getarannya ...',o:['0,2π s','0,5π s','π s','2π s'],a:0,e:'T = 2π√(0,5/50) = 2π(0,1) = 0,2π s.'},
{q:'Simpangan y = 0,1 sin(10t) m. Kecepatan maksimumnya ...',o:['0,1 m/s','1 m/s','10 m/s','100 m/s'],a:1,e:'v_maks = Aω = 0,1 × 10 = 1 m/s.'},
{q:'GHS dengan A = 0,2 m dan ω = 5 rad/s. Percepatan maksimumnya ...',o:['1 m/s²','2,5 m/s²','5 m/s²','25 m/s²'],a:2,e:'a_maks = Aω² = 0,2 × 25 = 5 m/s².'},
{q:'Percobaan bandul l = 0,5 m menghasilkan T = 1,4 s. Nilai g hitung dan galat terhadap 9,8 m/s² ...',o:['9,0 m/s², galat 8%','10,1 m/s², galat ± 3%','12 m/s², galat 22%','8,0 m/s², galat 18%'],a:1,e:'g = 4π²l/T² = 4(9,87)(0,5)/1,96 ≈ 10,1 m/s². Galat = 0,3/9,8 ≈ 3%.'},
{q:'Massa bandul dan massa beban pegas sama-sama dijadikan 2 kali. Periode bandul dan pegas berubah menjadi ...',o:['Bandul tetap, pegas √2 kali','Bandul √2 kali, pegas tetap','Keduanya 2 kali','Keduanya tetap'],a:0,e:'Bandul: T tidak bergantung m. Pegas: T ∝ √m sehingga naik √2 kali.'},
{q:'Jembatan pejalan kaki bergoyang hebat ketika dilalui banyak orang berjalan serempak. Evaluasi paling tepat ...',o:['Beban terlalu ringan','Frekuensi langkah mendekati frekuensi alami jembatan sehingga terjadi resonansi; perlu peredam/damper','Gravitasi berubah','Jembatan terlalu pendek'],a:1,e:'Pola resonansi seperti Millennium Bridge: frekuensi paksa mendekati frekuensi alami, amplitudo membesar.'},
{q:'Sistem pegas k = 200 N/m, amplitudo 0,1 m. Energi mekanik totalnya ...',o:['0,5 J','1 J','2 J','10 J'],a:1,e:'Em = ½kA² = ½(200)(0,01) = 1 J.'},
{q:'Prinsip kerja seismograf ...',o:['Massa beban yang lembam relatif diam, sedangkan rangka ikut bergetar bersama tanah sehingga selisihnya tercatat','Pegas memanjang karena gravitasi','Resonansi dengan gempa','Bandul menghasilkan energi'],a:0,e:'Kelembaman massa membuatnya hampir diam; gerak relatif massa terhadap rangka dicatat sebagai getaran tanah.'},
{q:'Perancangan Tuned Mass Damper pada gedung ...',o:['Massa peredam disetel pada frekuensi yang jauh dari gedung','Massa peredam disetel pada frekuensi alami gedung dan bergerak berlawanan fase untuk menyerap energi getaran','Massa peredam dipasang kaku pada gedung','Dibuat seberat mungkin tanpa pegas'],a:1,e:'TMD efektif bila frekuensinya disetel sama dengan frekuensi alami gedung dan bergerak berlawanan fase.'}];
const MAT=[
['1. Konsep Dasar GHS',`<p>Getaran harmonik sederhana (GHS) adalah gerak bolak-balik melalui titik setimbang dengan gaya pemulih sebanding simpangan.</p><ul class="list-disc ml-5 text-sm my-2"><li><b>Simpangan (y)</b>: jarak dari titik setimbang.</li><li><b>Amplitudo (A)</b>: simpangan maksimum.</li><li><b>Periode (T)</b>: waktu satu getaran (s).</li><li><b>Frekuensi (f)</b>: banyak getaran per sekon (Hz).</li></ul><p class="font-semibold">f = 1/T</p>`],
['2. Simpangan, Kecepatan, Percepatan',`<p class="text-sm">Dengan ω = 2πf:</p><ul class="my-2 text-sm"><li>Simpangan: <b>y = A sin(ωt)</b></li><li>Kecepatan (turunan y): <b>v = Aω cos(ωt)</b>, v_maks = Aω saat y = 0</li><li>Percepatan (turunan v): <b>a = −Aω² sin(ωt) = −ω²y</b>, a_maks = Aω² saat y = A</li></ul>`],
['3. Pegas & Bandul (Virtual Lab)',`<p class="text-sm">Pegas: F = −kx, <b>T = 2π√(m/k)</b>. Bandul: F = −mg sin θ, <b>T = 2π√(l/g)</b> untuk sudut kecil θ &lt; 15°. Gunakan lab di bawah: ubah variabel, jalankan stopwatch untuk 10 getaran, lalu catat data.</p>`],
['4. Energi pada GHS',`<p class="text-sm">Ek = ½mv², Ep = ½kx², <b>Em = Ek + Ep = ½kA²</b> (konstan). Ek maksimum di titik setimbang, Ep maksimum di amplitudo.</p>`],
['5. Penerapan & Resonansi',`<ul class="list-disc ml-5 text-sm"><li><b>Shock absorber</b>: meredam getaran kendaraan.</li><li><b>Seismograf</b>: massa lembam mencatat gerak tanah.</li><li><b>Dawai alat musik</b>: frekuensi menentukan nada.</li><li><b>Tuned Mass Damper</b>: massa peredam pada gedung tinggi tahan gempa.</li><li><b>Resonansi</b>: frekuensi paksa mendekati frekuensi alami membuat amplitudo membesar (Tacoma Narrows 1940, Millennium Bridge 2000).</li></ul>`]];

/* ===== NAV & PROGRESS ===== */
function go(t){tab=t;cur=null;if(t==='mod')modN=0;render();scrollTo(0,0)}
function prog(){const n=(S.diag&&S.diag.done?1:0)+Object.keys(S.mods).length+Object.values(S.hots).filter(h=>h.c).length+(S.ev&&S.ev.done?1:0);const p=Math.round(n/27*100);$('#pbar').style.width=p+'%';$('#ptxt').textContent=p+'%'}
function render(){
 document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 ({home:rHome,diag:rDiag,mod:rMod,hots:rHots,eval:rEval,rep:rRep})[tab]();prog();
}
function qBlock(q,i,sel,chk,fn,pre){
 let h=`<div class="card"><p class="text-sm font-semibold mb-1">${i+1}. ${q.q}</p>`;
 q.o.forEach((o,j)=>{const ok=chk&&j===q.a,bad=chk&&sel===j&&j!==q.a;h+=`<label class="opt text-sm ${ok?'bg-green-50 border-green-400':''} ${bad?'bg-red-50 border-red-400':''}"><input type="radio" name="${pre}${i}" ${sel===j?'checked':''} ${chk?'disabled':''} onchange="${fn}(${i},${j})"><span>${String.fromCharCode(65+j)}. ${o}</span></label>`});
 return h
}
/* ===== HOME / DIAGNOSTIK ===== */
function pick(i,j){if(!S.diag)S.diag={sel:[],done:false};S.diag.sel[i]=j;saveProgress()}
function submitDiag(){const d=S.diag;if(!d||d.sel.filter(x=>x!=null).length<5)return toast('Jawab kelima soal terlebih dahulu.');d.done=true;d.score=DIAG.filter((q,i)=>d.sel[i]===q.a).length/5*100;saveProgress();rHome()}
function resetDiag(){S.diag=null;saveProgress();rHome()}
function rHome(){
 if(!S.tgl)S.tgl=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const d=S.diag||{sel:[]};let h=`<div class="card" style="background:linear-gradient(135deg,#8B5CF6,#7C3AED);color:#fff"><div class="text-lg font-bold">Selamat datang! 👋</div><p class="text-sm mt-1">Pelajari Getaran Harmonik lewat simulasi, eksperimen virtual, dan latihan HOTS. Semua progress tersimpan otomatis di HP kamu.</p></div><div class="card"><b>👤 Identitas Murid</b><label class="text-xs block mt-2">Nama Murid</label><input type="text" placeholder="Tulis nama lengkap" value="${esc(S.nama)}" oninput="S.nama=this.value;saveProgress()"><label class="text-xs block mt-2">Kelas</label><input type="text" placeholder="Contoh: XI F.1" value="${esc(S.kelas)}" oninput="S.kelas=this.value;saveProgress()"><label class="text-xs block mt-2">Hari / Tanggal</label><input type="text" value="${esc(S.tgl)}" oninput="S.tgl=this.value;saveProgress()"></div>
 <div class="card"><b>📋 Asesmen Diagnostik</b><p class="text-xs text-slate-500">5 soal prasyarat untuk memetakan kesiapan belajar.</p></div>`;
 DIAG.forEach((q,i)=>{h+=qBlock(q,i,d.sel[i],d.done,'pick','d')+(d.done?`<p class="text-xs mt-2 text-violet-700">💡 ${q.e}</p>`:'')+'</div>'});
 if(d.done){const s=d.score,m=s<60?['Belum Siap','Rekomendasi: pendampingan dan review konsep dasar (Hukum Hooke, frekuensi, trigonometri).']:s<=80?['Cukup Siap','Rekomendasi: ikuti pembelajaran reguler.']:['Sangat Siap','Rekomendasi: pengayaan dengan kasus kompleks.'];
 h+=`<div class="card" style="background:#EDE9FE"><div class="text-2xl font-bold text-violet-700">${s}%</div><b>${m[0]}</b><p class="text-sm">${m[1]}</p><div class="flex gap-2 mt-3"><button class="btn flex-1" onclick="go('mod')">Mulai Belajar ➜</button><button class="btn2" onclick="resetDiag()">Ulang</button></div></div>`}
 else h+=`<button class="btn w-full" onclick="submitDiag()">Lihat Hasil Diagnostik</button>`;
 $('#app').innerHTML=h;
}
/* ===== MODUL ===== */
function rMod(){
 if(!modN){let h='<h2 class="font-bold text-violet-700 mb-2">📚 Pilih Sub-materi</h2>';MAT.forEach((m,i)=>h+=`<button class="card w-full text-left flex justify-between items-center" onclick="openMod(${i+1})"><span class="font-semibold text-sm">${m[0]}</span><span>${S.mods[i+1]?'✅':'➜'}</span></button>`);$('#app').innerHTML=h;return}
 const n=modN,m=MAT[n-1];S.mods[n]=true;saveProgress();
 let h=`<button class="btn2 mb-2" onclick="go('mod')">⬅ Daftar Modul</button>${petunjuk(n)}`,MT=`<div class="card"><h2 class="font-bold text-violet-700 mb-1">${m[0]}</h2>${m[1]}</div>`;
 if(n===1)h+=`<div class="card"><b>🎮 Simulasi 1: Titik Setimbang & Amplitudo</b><canvas id="c1"></canvas><label class="text-xs">Amplitudo A: <span id="v1a"></span> cm</label><input type="range" min="10" max="100" value="${s1.A}" oninput="s1.A=+this.value;$('#v1a').textContent=this.value"><label class="text-xs">Frekuensi f: <span id="v1f"></span> Hz</label><input type="range" min="0.2" max="2" step="0.1" value="${s1.f}" oninput="s1.f=+this.value;$('#v1f').textContent=this.value;$('#v1t').textContent=(1/this.value).toFixed(2)"><p class="text-sm mt-1">Periode ${M('T = 1/f')} = <b id="v1t"></b> s</p></div>`;
 if(n===2)h+=`<div class="card"><b>🎮 Simulasi 2: Plotter Gelombang</b><canvas id="c2"></canvas><div class="flex gap-2 my-2"><button class="btn2 flex-1" onclick="s2.k='y'">y(t)</button><button class="btn2 flex-1" onclick="s2.k='v'">v(t)</button><button class="btn2 flex-1" onclick="s2.k='a'">a(t)</button><button class="btn" id="pz" onclick="s2.p=!s2.p;this.textContent=s2.p?'▶':'⏸'">⏸</button></div><label class="text-xs">Amplitudo A: <span id="v2a"></span> m</label><input type="range" min="0.1" max="2" step="0.1" value="${s2.A}" oninput="s2.A=+this.value;$('#v2a').textContent=this.value"><label class="text-xs">Kecepatan sudut ω: <span id="v2w"></span> rad/s</label><input type="range" min="1" max="10" step="0.5" value="${s2.w}" oninput="s2.w=+this.value;$('#v2w').textContent=this.value"><p id="v2o" class="text-xs mt-1 font-mono"></p></div>`;

rHots=function(){let h='<h2 class="font-bold text-violet-700">✍️ Latihan HOTS</h2><p class="text-xs mb-2">20 soal berbasis literasi, 5 sub-materi. Pilih jawaban lalu tekan Cek Jawaban.</p>',n=0,sub=0;
 ST.forEach(st=>{if(st.sub!==sub){sub=st.sub;h+=`<div class='font-bold text-sm text-white rounded-xl px-3 py-2 my-2' style='background:#7C3AED'>Sub-materi ${sub}: ${SUBN[sub-1]}</div>`}
  h+=`<div class='card' style='background:#EDE9FE'><b class='text-sm'>${st.h}</b><p class='text-sm mt-1'>${st.x}</p></div>`;
  st.q.forEach(q=>{const i=n++,s=S.hots[i]||{};h+=qBlock(q,i,s.sel,s.c,'hpick','h');
   h+=s.c?`<p class='text-sm mt-2 ${s.ok?'text-green-700':'text-red-600'}'>${s.ok?'✅ Tepat!':'❌ Belum tepat. Kunci: '+String.fromCharCode(65+q.a)+'.'} ${q.e}</p><button class='btn2 mt-2 text-xs' onclick='hredo(${i})'>Coba lagi</button>`:`<button class='btn w-full mt-2' onclick='hcheck(${i})'>Cek Jawaban</button>`;h+='</div>'})});
 $('#app').innerHTML=h};
function repDetail(){const L=i=>i==null?'-':String.fromCharCode(65+i),d=S.diag;
 let h=`<div class='card'><b>📋 Rincian Kuis Diagnostik</b><p class='text-xs'>Modul dipelajari: ${Object.keys(S.mods).length}/5</p>`;
 if(d&&d.done)h+=`<table class='mt-2'><tr><th>No</th><th>Jawaban</th><th>Kunci</th><th>Hasil</th></tr>`+DIAG.map((q,i)=>`<tr><td>${i+1}</td><td>${L(d.sel[i])}</td><td>${L(q.a)}</td><td>${d.sel[i]===q.a?'✅ Benar':'❌ Salah'}</td></tr>`).join('')+`</table><p class='text-sm mt-1'>Skor: <b>${d.score}%</b></p>`;else h+=`<p class='text-sm mt-1'><i>Belum dikerjakan.</i></p>`;
 h+=`</div><div class='card'><b>✍️ Rincian Latihan HOTS</b><table class='mt-2'><tr><th>Sub-materi</th><th>Dikerjakan</th><th>Benar</th><th>Nilai</th></tr>`;
 SUBN.forEach((nm,s)=>{const ix=HOTS.map((q,i)=>i).filter(i=>HOTS[i].sub===s+1),dn=ix.filter(i=>S.hots[i]&&S.hots[i].c).length,ok=ix.filter(i=>S.hots[i]&&S.hots[i].ok).length;h+=`<tr><td style='text-align:left'>${s+1}. ${nm}</td><td>${dn}/${ix.length}</td><td>${ok}</td><td>${Math.round(ok/ix.length*100)}</td></tr>`});
 h+=`</table><table class='mt-2'><tr><th>No</th><th>Jawaban</th><th>Hasil</th></tr>`+HOTS.map((q,i)=>{const s=S.hots[i]||{};return `<tr><td>${i+1}</td><td>${L(s.sel)}</td><td>${s.c?(s.ok?'✅':'❌'):'–'}</td></tr>`}).join('')+`</table></div>`;return h}
const _lh=labHTML;labHTML=function(){const o=_lh(),i=o.indexOf('<div class="card"><b>📊 Tabel'),B=labTab==='b',tt=";$('#tt').textContent=labT().toFixed(2)";
